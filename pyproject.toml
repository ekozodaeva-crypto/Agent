[project]
name = "candidate-match-agent"
version = "0.1.0"
description = "Candidate Match & Outreach Agent for IT recruiters (powered by Claude)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
candidate-agent = "candidate_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["candidate_agent"]
